name = "slack-archive"
main = "src/worker.ts"
compatibility_date = "2025-12-01"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = false

[observability]
enabled = true

[assets]
directory = "./dist/client"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Non-secret runtime vars
# DEV_USER_EMAIL must be explicitly empty in production to prevent auth bypass.
[vars]
DEV_USER_EMAIL = ""
# Alarm threshold: send Slack alarm when D1 database size exceeds this value (MB).
# D1 free tier limit is 500 MB per database. Default: 400 MB (80% of free tier limit).
D1_ALARM_SIZE_THRESHOLD_MB = 400
# Set to "true" to send a D1 size report to Slack on every cron run (for monitoring).
# Set to "false" or remove to disable; threshold alarm still fires regardless.
D1_SIZE_REPORT_ENABLED = "true"

[[d1_databases]]
binding = "DB"
database_name = "slack-archive-db"
database_id = "31ee33df-b617-4d03-9598-923b8382fa69"
migrations_dir = "migrations"

[triggers]
crons = ["0 17 * * *"]
